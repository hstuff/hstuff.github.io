<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photography</title>
  <!-- Shared site styles first, then this page's own styles (which win where they overlap) -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="photography.css">
</head>
<body class="photo-page">

  <nav class="navbar">
    <a href="index.html">Mathematical Research</a>
    <a href="projects.html">Teaching and Mentoring</a>
    <a href="photography.html" class="active">Photography</a>
    <a href="projects.html">Other Projects</a>
  </nav>

  <!-- ===== Section 1: dark ===== -->
  <section class="band dark">
    <div class="inner">
      <h1>Photography</h1>
      <p>A short introduction to your photography goes here.</p>

      <!-- A full-width photo with a caption -->
      <figure class="photo">
        <img src="files/photographs/Tyndall-Gorge-from-Emerald-Lake-RMNP.jpg" alt="Tyndall Gorge from Emerald Lake, Rocky Mountain National Park">
        <figcaption>Tyndall Gorge from Emerald Lake, Rocky Mountain National Park, July 2025.</figcaption>
      </figure>

      <!-- A smaller photo (70% of the column), centred -->
      <figure class="photo medium">
        <img src="images/photography/second-photo.jpg" alt="Describe the photo here">
        <figcaption>Caption for the second photo.</figcaption>
      </figure>
    </div>
  </section>

  <!-- ===== Section 2: light ===== -->
  <section class="band light">
    <div class="inner">
      <h2>Another series</h2>

      <!-- Two photos side by side (they stack on phones) -->
      <div class="photo-row">
        <figure class="photo">
          <img src="images/photography/third-photo.jpg" alt="Describe the photo here">
          <figcaption>Left photo caption.</figcaption>
        </figure>
        <figure class="photo">
          <img src="images/photography/fourth-photo.jpg" alt="Describe the photo here">
          <figcaption>Right photo caption.</figcaption>
        </figure>
      </div>

      <!-- A small photo (45% of the column), centred -->
      <figure class="photo small">
        <img src="images/photography/fifth-photo.jpg" alt="Describe the photo here">
        <figcaption>Caption for a small photo.</figcaption>
      </figure>
    </div>
  </section>

  <!-- ===== Section 3: warm grey ===== -->
  <section class="band warm">
    <div class="inner">
      <h2>A third section</h2>
      <figure class="photo">
        <img src="images/photography/sixth-photo.jpg" alt="Describe the photo here">
        <figcaption>Caption.</figcaption>
      </figure>
    </div>
  </section>

</body>
</html>
